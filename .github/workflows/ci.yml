name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: bun install --frozen-lockfile
      - run: bun run abi
      - run: bun run check
      - run: bun run --filter @kitty/web build
      - run: git diff --exit-code -- packages/shared/src/abi.ts apps/web/src/routeTree.gen.ts
